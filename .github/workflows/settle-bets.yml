# Hits /api/cron/settle-bets every 30 minutes from GitHub Actions, since
# Vercel Hobby plan caps cron at once-per-day. Keeps the same auth contract
# (Bearer CRON_SECRET) as the in-Vercel cron entry — see vercel.json.
#
# Required repo secrets:
#   - SITE_URL    e.g. https://thesuperfunded.com
#   - CRON_SECRET (must match Vercel env)
name: settle-bets

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min UTC
  workflow_dispatch:          # allow manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/settle-bets
        run: |
          status=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/settle-bets")
          echo "HTTP $status"
          cat /tmp/body || true
          # Treat 2xx as success; anything else fails the workflow.
          [[ "$status" =~ ^2 ]] || exit 1
