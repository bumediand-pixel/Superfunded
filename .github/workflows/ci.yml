name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Prisma validate
        run: npx prisma validate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
