  <!-- Headline -->
  <text x="60" y="320" font-family="Impact, 'Bebas Neue', sans-serif" font-size="120" font-weight="900" fill="#0f172a" letter-spacing="-2">Pariezi cu</text>
  <text x="60" y="430" font-family="Impact, 'Bebas Neue', sans-serif" font-size="120" font-weight="900" fill="#E63946" letter-spacing="-2">banii NOȘTRI.</text>

