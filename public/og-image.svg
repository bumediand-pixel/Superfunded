  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo block -->
  <rect x="60" y="60" width="120" height="120" rx="24" fill="url(#redblock)"/>
  <text x="120" y="148" font-family="Impact, 'Bebas Neue', sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SF</text>

  <text x="200" y="125" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#0f172a">SUPERFUNDED</text>
