<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Geometric SF mark: stacked tilted squares forming an upward stack (funding / growth) -->
  <defs>
    <linearGradient id="lgRedDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4654"/>
      <stop offset="100%" stop-color="#b11626"/>
    </linearGradient>
    <linearGradient id="lgRedLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a93"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- Rounded background tile -->
  <rect width="512" height="512" rx="120" fill="#0a0a0a"/>

  <!-- Stack: 3 rotated rectangles forming an arrow-up / stack motif -->
  <!-- bottom (largest, dimmer) -->
  <rect x="148" y="316" width="216" height="44" rx="22" fill="#3a0e15"/>
  <!-- middle -->
  <rect x="148" y="244" width="216" height="44" rx="22" fill="url(#lgRedDark)"/>
  <!-- top (highlight) -->
  <rect x="148" y="172" width="216" height="44" rx="22" fill="url(#lgRedLight)"/>

  <!-- Arrow notch carved into top of stack -->
  <path d="M256 132 L300 176 L212 176 Z" fill="#ffffff"/>
</svg>
