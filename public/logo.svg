<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TheSuperFunded">
  <!-- Same geometry as favicon.svg, scaled 8x. Single source of truth for the
       brand mark — used in OG image, PWA icon, Apple touch icon, etc. -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  <!-- Upper S hook -->
  <path d="M128 128 H368 V192 H208 V240 H144 Z" fill="#ffffff"/>
  <!-- Lower S hook (mirrored) -->
  <path d="M384 384 H144 V320 H304 V272 H368 Z" fill="#ffffff"/>
  <!-- Red diagonal wedge slicing through the centre -->
  <path d="M112 336 L400 144 L424 192 L136 384 Z" fill="#E63946"/>
</svg>
